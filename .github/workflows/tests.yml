name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run deterministic smoke suite
        # Discovers tests/test_*.py: byte-stable generator, empty-result guard,
        # and the site-data exporter contract. Pure stdlib, no network.
        run: python scripts/run_smoke_test.py
