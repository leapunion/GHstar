<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GHstar — AI &amp; Agent Radar</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">LeapUnion Daily GitHub Intelligence</p>
        <h1>AI, Agent &amp; Enterprise Radar</h1>
        <p class="sub">Live radar across all report dates — filter, search, and explore momentum signals for Leap Agent Commerce OS and Leap Agentic Enterprise OS.</p>
      </div>
      <time id="build-time" title="Last data build">—</time>
    </header>

    <main id="app">
      <!-- Filter bar -->
      <section id="filter-bar" class="spa-filter-bar" aria-label="Filters">
        <div class="spa-filter-row">
          <label class="spa-filter-group">
            <span>Date</span>
            <select id="f-date">
              <option value="all">All dates (corpus)</option>
            </select>
          </label>

          <label class="spa-filter-group">
            <span>Category</span>
            <select id="f-category" multiple size="1">
              <option value="">All categories</option>
            </select>
          </label>

          <label class="spa-filter-group">
            <span>Subcategory</span>
            <select id="f-subcategory" multiple size="1">
              <option value="">All subcategories</option>
            </select>
          </label>

          <label class="spa-filter-group">
            <span>Language</span>
            <select id="f-language" multiple size="1">
              <option value="">All languages</option>
            </select>
          </label>

          <label class="spa-filter-group">
            <span>Action Level</span>
            <select id="f-action-level" multiple size="1">
              <option value="">All levels</option>
            </select>
          </label>

          <label class="spa-filter-group">
            <span>Keyword</span>
            <input id="f-keyword" type="search" placeholder="name, description, topics…" autocomplete="off">
          </label>

          <label class="spa-filter-group">
            <span>Sort by</span>
            <select id="f-sort">
              <option value="momentum_score">Momentum score</option>
              <option value="strategic_score">Strategic score</option>
              <option value="stars">Stars</option>
              <option value="stars_per_day">Stars / day</option>
            </select>
          </label>

          <button id="btn-reset" class="spa-reset-btn" type="button">Reset</button>
        </div>
      </section>

      <!-- Trends panel (collapsible) -->
      <details id="trends-panel" class="panel spa-trends">
        <summary><span>Trends</span> <span id="trends-subtitle" class="spa-trends-sub"></span></summary>
        <div id="trends-body" class="spa-trends-body"></div>
      </details>

      <!-- Results -->
      <div id="results-header" class="spa-results-header">
        <span id="results-count"></span>
      </div>

      <div id="card-list" class="repo-grid spa-card-list" role="list"></div>

      <div id="show-more-row" class="spa-show-more-row" hidden>
        <button id="btn-show-more" type="button" class="spa-show-more-btn">Show more</button>
      </div>

      <div id="loading" class="spa-loading" aria-live="polite">Loading data…</div>
      <div id="error-msg" class="spa-error" hidden></div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
